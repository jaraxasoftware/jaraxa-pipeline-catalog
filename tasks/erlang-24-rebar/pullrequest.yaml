apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: pullrequest
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 400m
              memory: 512Mi
          workingDir: /workspace/source
        steps:
        - image: ghcr.io/jenkins-x/jx-boot:3.11.107
          name: jx-variables
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx gitops variables
            jx gitops pr variables
        - image: erlang:24.3.4.17@sha256:45c6aca9df027efc2787480ddd3dc5954e956b2ac08632220f5624d88948fb88
          name: check-erlang
          resources: {}
          script: |
            #!/usr/bin/env bash
            source .jx/variables.sh
            echo "Erlang/Rebar3 versions are:"
            rebar3 version
        - image: erlang:24.3.4.17@sha256:45c6aca9df027efc2787480ddd3dc5954e956b2ac08632220f5624d88948fb88
          name: build-erlang-develop
          resources: {}
          script: |
            #!/bin/bash
            source .jx/variables.sh
            git config --global url."https://".insteadOf git://
            # Workaround: create erl_interface symlink for jiffy NIF compilation
            ERL_INTERFACE_DIR=$(find /usr/local/lib/erlang/lib -maxdepth 1 -name "erl_interface-*" -type d 2>/dev/null | head -1)
            if [ -n "$ERL_INTERFACE_DIR" ] && [ -f "$ERL_INTERFACE_DIR/lib/libei.a" ] && [ ! -f "$ERL_INTERFACE_DIR/lib/liberl_interface.a" ]; then
              ln -s "$ERL_INTERFACE_DIR/lib/libei.a" "$ERL_INTERFACE_DIR/lib/liberl_interface.a"
            fi
            rebar3 release --relname $APP_NAME --output-dir ./
        - image: ghcr.io/jenkins-x/jx-registry:0.1.1
          name: check-registry
          resources: {}
        - image: ghcr.io/hadolint/hadolint:latest-debian
          name: check-dockerfile
          resources: {}
          script: |
            #!/usr/bin/env bash
            source .jx/variables.sh
            hadolint --no-fail Dockerfile
        - image: gcr.io/kaniko-project/executor:v1.23.0-debug
          name: build-container-build
          resources: {}
          script: |
            #!/busybox/sh
            source .jx/variables.sh
            cp /tekton/creds-secrets/tekton-container-registry-auth/.dockerconfigjson /kaniko/.docker/config.json
            /kaniko/executor $KANIKO_FLAGS --context=/workspace/source --dockerfile=${DOCKERFILE_PATH:-Dockerfile} --destination=$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION
        - image: quay.io/helmpack/chart-testing:v3.7.1
          name: helm-chart-testing
          resources: {}
          script: |
            #!/bin/bash
            source .jx/variables.sh
            ct lint --charts charts/$REPO_NAME --validate-maintainers=false
        - image: ghcr.io/jenkins-x-plugins/jx-preview:0.4.7
          name: promote-jx-preview
          resources: {}
          script: |
            #!/usr/bin/env sh
            source .jx/variables.sh
            jx preview create
  podTemplate: {}
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
